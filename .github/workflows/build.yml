name: "NotePad Pro 1.0.2-slint: Rust + Slint reimplementation"

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Static cross-file contract check ────────────────────────────────────
  consistency:
    name: Consistency lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-file contract check
        run: python3 tools/check_consistency.py

  # ── Fast compile verification on a pool that is not being killed ───────
  # The windows pool started silently killing cargo mid-compile (2026-09-08);
  # `cargo check` on ubuntu still runs every build.rs (including slint-build,
  # which compiles all .slint files) and type-checks the whole workspace, so
  # code regressions surface here even while the windows build is flaky.
  check:
    name: Compile check (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
      - name: System libs for Slint backend build scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libfontconfig1-dev libfreetype-dev libwayland-dev libx11-xcb-dev libudev-dev pkg-config
      - name: cargo check (workspace)
        run: cargo check --workspace --verbose 2>&1 | tee check.log; exit ${pipestatus[0]}
      - name: Surface check errors
        if: failure()
        run: |
          grep -E "^error" -A 8 check.log | head -80 | sed 's/^/::error::/'
          tail -25 check.log | sed 's/^/::error::TAIL /'
          exit 0

  # ── Windows build, tests, installer ─────────────────────────────────────
  build:
    name: windows-latest
    needs: consistency
    # windows-latest (2025 pool) started silently killing cargo mid-compile
    # (exit 1, no error output, random stop points) on 2026-09-08; the 2022
    # image is a different pool and was unaffected.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Override the in-repo MSRV pin for CI
        # Pinned, not floating `stable`: a newly published stable coincided
        # with silent mid-compile runner kills (cargo died with no error
        # output while deps compiled). Reproduce with a known-good compiler.
        run: |
          rustup toolchain install 1.89 --profile minimal
          rustup override set 1.89

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Build (release)
        timeout-minutes: 40
        run: |
          # Markers are appended INTO cargo.log (not just stdout) so the
          # annotation-surfacing step — which can only show ~10 lines — always
          # sees the exit code and whether cargo printed a real error. The log
          # zip channel is blocked from this sandbox, so annotations are the
          # only window; they must carry the ending, not a mid-build slice.
          cargo build --release *> cargo.log
          $code = $LASTEXITCODE
          $hasErr = [bool](Select-String -Path cargo.log -Pattern "^error" -Quiet)
          if ($code -ne 0 -and -not $hasErr) {
            Add-Content cargo.log "SILENT-DEATH code=$code - retrying once"
            cargo build --release *>> cargo.log
            $code = $LASTEXITCODE
          }
          Add-Content cargo.log "BUILD-EXIT=$code HASERROR=$([bool](Select-String -Path cargo.log -Pattern '^error' -Quiet))"
          exit $code
        shell: pwsh

      - name: Test
        run: |
          cargo test --verbose *>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Surface cargo log as annotations
        if: failure()
        shell: pwsh
        run: |
          # GitHub keeps only ~10 annotations of a level per step. Earlier this
          # step emitted `Select-Object -Last 40` TAIL lines, so the cap kept
          # the FIRST 10 of that window -- a mid-build slice -- and silently
          # dropped the real end of the log where the actual error lives. Now:
          # one DIAG line (real error? how far? exit code), then the TRUE last
          # 9 lines. That ending is the whole point.
          $log = "cargo.log"; if (-not (Test-Path $log)) { $log = "cargo-test.log" }
          if (Test-Path $log) {
            $hasErr = [bool](Select-String -Path $log -Pattern "^error" -Quiet)
            $n = (Get-Content $log).Count
            Write-Output "::error::DIAG log=$log hasError=$hasErr totalLines=$n"
            Get-Content $log | Select-Object -Last 9 | ForEach-Object { Write-Output "::error::TAIL $_" }
          } else {
            Write-Output "::error::DIAG no cargo log found"
          }
          exit 0

      - name: Smoke-check the binary
        run: ./target/release/notepadpro.exe --help

      - name: UI pixel probe (wrap on)
        shell: pwsh
        run: pwsh -File ci/ui_probe.ps1 wrap-on

      - name: UI pixel probe (wrap off)
        shell: pwsh
        run: pwsh -File ci/ui_probe.ps1 wrap-off

      - name: UI interact probe (Enter hang + wash drift)
        shell: pwsh
        run: pwsh -File ci/ui_probe.ps1 interact

      - name: Upload UI probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-probe
          path: ui_probe_*.png
          if-no-files-found: ignore

      - name: Build MSI installer (WiX 3.11)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix311rtm/wix311-binaries.zip" -OutFile wix.zip
          Expand-Archive -Path wix.zip -DestinationPath wix-bin
          .\wix-bin\candle.exe wix\main.wxs -arch x64 -out wix\main.wixobj *>&1 | Tee-Object -FilePath wix.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\wix-bin\light.exe -ext WixUIExtension wix\main.wixobj -out NotePad-Pro-1.0.2.msi *>&1 | Tee-Object -Append wix.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload WiX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wix-log
          path: wix.log

      - name: Surface WiX log as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path wix.log) {
            Get-Content wix.log | ForEach-Object { Write-Output "::error::$_" }
          }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-pro-windows
          path: target/release/notepadpro.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-pro-windows-installer
          path: NotePad-Pro-1.0.2.msi
          if-no-files-found: error

  # ── Attach binaries to version-tag releases ─────────────────────────────
  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
