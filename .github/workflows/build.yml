# Build, test and package NotePad Pro on GitHub Actions.
#
# The binary is fully self-contained (Slint + SQLite statically linked), so each
# job only needs a Rust toolchain plus, on Linux, a few system headers for the
# Slint backend. Tests run headless through `slint-testing` — no display needed.

name: build

on:
  push:
    branches: [main, "arena/*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Tests must never touch the real user data directory.
  XDG_DATA_HOME: ${{ github.workspace }}/.ci-data

jobs:
  # ── Cross-file contract lint (runs everywhere, no Rust needed) ──────────
  consistency:
    name: Consistency lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run check_consistency.py
        run: python3 tools/check_consistency.py

  # ── Build + test on the three desktop platforms ─────────────────────────
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: consistency
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: notepadpro
            bin: target/release/notepadpro
          - os: windows-latest
            artifact: notepadpro.exe
            bin: target/release/notepadpro.exe
          - os: macos-latest
            artifact: notepadpro-macos
            bin: target/release/notepadpro
    steps:
      - uses: actions/checkout@v4

      # The repo pins MSRV 1.78 in rust-toolchain.toml; CI builds on stable so
      # it always resolves the latest compatible dependency graph. Local dev
      # still honours the MSRV pin.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Override the in-repo MSRV pin for CI
        run: rustup override set stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}

      # Slint's Linux backend links against a handful of system libraries.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libfontconfig1-dev libfreetype6-dev

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --verbose

      - name: Smoke-check the binary
        run: ${{ matrix.bin }} --help

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

  # ── Attach binaries to version-tag releases ─────────────────────────────
  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
