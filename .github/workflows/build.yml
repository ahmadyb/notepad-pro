name: "NotePad Pro 1.0.2-slint: Rust + Slint reimplementation"

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Static cross-file contract check ────────────────────────────────────
  consistency:
    name: Consistency lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-file contract check
        run: python3 tools/check_consistency.py

  # ── Fast compile verification on a pool that is not being killed ───────
  # The windows pool started silently killing cargo mid-compile (2026-09-08);
  # `cargo check` on ubuntu still runs every build.rs (including slint-build,
  # which compiles all .slint files) and type-checks the whole workspace, so
  # code regressions surface here even while the windows build is flaky.
  check:
    name: Compile check (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89
      - name: System libs for Slint backend build scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libfontconfig1-dev libfreetype-dev libwayland-dev libx11-xcb-dev libudev-dev pkg-config
      - name: cargo check (workspace)
        run: cargo check --workspace --verbose 2>&1 | tee check.log; exit ${pipestatus[0]}
      - name: Surface check errors
        if: failure()
        run: |
          grep -E "^error" -A 8 check.log | head -80 | sed 's/^/::error::/'
          tail -25 check.log | sed 's/^/::error::TAIL /'
          exit 0

  # ── Windows build, tests, installer ─────────────────────────────────────
  build:
    name: windows-latest
    needs: consistency
    # windows-latest (2025 pool) started silently killing cargo mid-compile
    # (exit 1, no error output, random stop points) on 2026-09-08; the 2022
    # image is a different pool and was unaffected.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Override the in-repo MSRV pin for CI
        # Pinned, not floating `stable`: a newly published stable coincided
        # with silent mid-compile runner kills (cargo died with no error
        # output while deps compiled). Reproduce with a known-good compiler.
        run: |
          rustup toolchain install 1.89 --profile minimal
          rustup override set 1.89

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Build (release)
        env:
          # The windows runner died silently (no compiler error, exit 1) while
          # rustc compiled heavy deps in parallel; cap jobs so the release
          # profile (lto, codegen-units=1) stays inside runner memory.
          CARGO_BUILD_JOBS: 1
        timeout-minutes: 40
        run: |
          # Both windows pools started silently killing the step tree while
          # rustc ran (exit 1, no compiler output, random stop points) at the
          # same wall-clock boundary on 2026-09-08 — signature of a Defender
          # false positive on rustc. Runners are admin; mute it for the build.
          try { Add-MpPreference -ExclusionPath "D:\a" } catch { Write-Output "MP-exclusion: $_" }
          try { Set-MpPreference -DisableRealtimeMonitoring $true } catch { Write-Output "MP-disable: $_" }
          # No pipeline: earlier runs died silently (exit 1, cargo.log ending
          # mid-compile) with `cargo *>&1 | Tee-Object`. Redirect to the log
          # file directly, report the exit code, and retry once on a silent
          # death so a one-off runner kill cannot sink the build.
          cargo build --release *> cargo.log
          $code = $LASTEXITCODE
          if ($code -ne 0 -and -not (Select-String -Path cargo.log -Pattern "^error" -Quiet)) {
            Write-Output "SILENT-DEATH code=$code - retrying once"
            cargo build --release *>> cargo.log
            $code = $LASTEXITCODE
          }
          Write-Output "BUILD-EXIT=$code"
          Get-Content cargo.log -Tail 30
          exit $code
        shell: pwsh

      - name: Test
        run: |
          cargo test --verbose *>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Surface cargo log as annotations
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in @("cargo.log", "cargo-test.log")) {
            if (Test-Path $f) {
              # Tail first: it always shows why the step died (the annotation
              # list has a budget and tails used to be truncated away).
              Get-Content $f | Select-Object -Last 40 | ForEach-Object { Write-Output "::error::TAIL[$f] $_" }
              Get-Content $f | Select-String -Pattern "^error" -Context 0,8 | Select-Object -First 25 | ForEach-Object { $_.ToString().Split("\n") | ForEach-Object { Write-Output "::error::$_" } }
              Get-Content $f | Select-String -Pattern "FAILED|panicked at" -Context 0,4 | Select-Object -First 20 | ForEach-Object { $_.ToString().Split("\n") | ForEach-Object { Write-Output "::error::$_" } }
            }
          }
          exit 0

      - name: Smoke-check the binary
        run: ./target/release/notepadpro.exe --help

      - name: UI pixel probe (wrap on)
        shell: pwsh
        run: pwsh -File ci/ui_probe.ps1 wrap-on

      - name: UI pixel probe (wrap off)
        shell: pwsh
        run: pwsh -File ci/ui_probe.ps1 wrap-off

      - name: UI interact probe (Enter hang + wash drift)
        shell: pwsh
        run: pwsh -File ci/ui_probe.ps1 interact

      - name: Upload UI probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-probe
          path: ui_probe_*.png
          if-no-files-found: ignore

      - name: Build MSI installer (WiX 3.11)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix311rtm/wix311-binaries.zip" -OutFile wix.zip
          Expand-Archive -Path wix.zip -DestinationPath wix-bin
          .\wix-bin\candle.exe wix\main.wxs -arch x64 -out wix\main.wixobj *>&1 | Tee-Object -FilePath wix.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\wix-bin\light.exe -ext WixUIExtension wix\main.wixobj -out NotePad-Pro-1.0.2.msi *>&1 | Tee-Object -Append wix.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload WiX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wix-log
          path: wix.log

      - name: Surface WiX log as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path wix.log) {
            Get-Content wix.log | ForEach-Object { Write-Output "::error::$_" }
          }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-pro-windows
          path: target/release/notepadpro.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-pro-windows-installer
          path: NotePad-Pro-1.0.2.msi
          if-no-files-found: error

  # ── Attach binaries to version-tag releases ─────────────────────────────
  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
