name: "NotePad Pro 1.0.2-slint: Rust + Slint reimplementation"

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Static cross-file contract check ────────────────────────────────────
  consistency:
    name: Consistency lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-file contract check
        run: python3 tools/check_consistency.py

  # ── Windows build, tests, installer ─────────────────────────────────────
  build:
    name: windows-latest
    needs: consistency
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Override the in-repo MSRV pin for CI
        run: rustup override set stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Build (release)
        run: |
          cargo build --release --verbose *>&1 | Tee-Object -FilePath cargo.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Test
        run: |
          cargo test --verbose *>&1 | Tee-Object -FilePath cargo-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Surface cargo log as annotations
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in @("cargo.log", "cargo-test.log")) {
            if (Test-Path $f) {
              Get-Content $f | Select-String -Pattern "^error|FAILED|panicked at|test result|^warning: unused|-->" -Context 0,6 | Select-Object -First 40 | ForEach-Object { $_.ToString().Split("\n") | ForEach-Object { Write-Output "::error::$_" } }
              Get-Content $f | Select-Object -Last 45 | ForEach-Object { Write-Output "::error::TAIL[$f] $_" }
            }
          }

      - name: Smoke-check the binary
        run: ./target/release/notepadpro.exe --help

      - name: UI pixel probe (wrap on)
        shell: pwsh
        run: pwsh -File ci/ui_probe.ps1 wrap-on

      - name: UI pixel probe (wrap off)
        shell: pwsh
        run: pwsh -File ci/ui_probe.ps1 wrap-off

      - name: UI interact probe (Enter hang + wash drift)
        shell: pwsh
        run: pwsh -File ci/ui_probe.ps1 interact

      - name: Upload UI probe screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-probe
          path: ui_probe_*.png
          if-no-files-found: ignore

      - name: Build MSI installer (WiX 3.11)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix311rtm/wix311-binaries.zip" -OutFile wix.zip
          Expand-Archive -Path wix.zip -DestinationPath wix-bin
          .\wix-bin\candle.exe wix\main.wxs -arch x64 -out wix\main.wixobj *>&1 | Tee-Object -FilePath wix.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\wix-bin\light.exe -ext WixUIExtension wix\main.wixobj -out NotePad-Pro-1.0.2.msi *>&1 | Tee-Object -Append wix.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload WiX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wix-log
          path: wix.log

      - name: Surface WiX log as annotations
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path wix.log) {
            Get-Content wix.log | ForEach-Object { Write-Output "::error::$_" }
          }

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-pro-windows
          path: target/release/notepadpro.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-pro-windows-installer
          path: NotePad-Pro-1.0.2.msi
          if-no-files-found: error

  # ── Attach binaries to version-tag releases ─────────────────────────────
  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
